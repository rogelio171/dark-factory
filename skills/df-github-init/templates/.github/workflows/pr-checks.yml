name: pr-checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect and run lint
        run: |
          set -euo pipefail
          if [ -f package.json ] && jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
            npm run lint
          elif [ -f pyproject.toml ] && command -v ruff >/dev/null 2>&1; then
            pip install ruff
            ruff check .
          elif [ -f go.mod ]; then
            go vet ./...
          elif [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
            cargo clippy --all-targets -- -D warnings
          elif [ -f Makefile ] && grep -qE '^lint:' Makefile; then
            make lint
          else
            echo "No lint tooling detected; skipping."
          fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect and run typecheck
        run: |
          set -euo pipefail
          if [ -f package.json ] && jq -e '.scripts.typecheck' package.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
            npm run typecheck
          elif [ -f tsconfig.json ]; then
            npx --yes tsc --noEmit
          elif [ -f pyproject.toml ] && grep -q mypy pyproject.toml; then
            pip install mypy
            mypy .
          else
            echo "No typecheck tooling detected; skipping."
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect and run tests
        run: |
          set -euo pipefail
          if [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
            npm test --silent
          elif [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e .[test] || pip install -e .
            pytest -q
          elif [ -f go.mod ]; then
            go test ./...
          elif [ -f Cargo.toml ]; then
            cargo test --all
          elif [ -f Makefile ] && grep -qE '^test:' Makefile; then
            make test
          else
            echo "No test tooling detected; failing closed."
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect and run build
        run: |
          set -euo pipefail
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
            npm run build
          elif [ -f go.mod ]; then
            go build ./...
          elif [ -f Cargo.toml ]; then
            cargo build --all-targets
          elif [ -f Makefile ] && grep -qE '^build:' Makefile; then
            make build
          else
            echo "No build tooling detected; skipping."
          fi

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact -v
      - name: Dependency audit
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
            npm audit --omit=dev --audit-level=critical
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm audit --prod --audit-level critical
          elif [ -f Cargo.toml ]; then
            cargo install cargo-audit --locked --quiet || true
            cargo audit --deny warnings
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            pip install pip-audit
            pip-audit --strict
          else
            echo "No dependency manifest detected; skipping audit."
          fi
