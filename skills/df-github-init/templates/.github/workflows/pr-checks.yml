name: pr-checks

on:
  pull_request:
  push:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

# Replace placeholder command blocks with values from wiki/project-profile.md.
# Keep job names stable if they are required by branch protection.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run module-scoped lint
        run: |
          set -euo pipefail
          # Example:
          # (cd packages/app && npm run lint)
          echo "Configure lint commands from wiki/project-profile.md"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run module-scoped typecheck
        run: |
          set -euo pipefail
          # Example:
          # (cd packages/app && npm run typecheck)
          echo "Configure typecheck commands from wiki/project-profile.md"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run module-scoped tests
        run: |
          set -euo pipefail
          # Example:
          # (cd packages/app && npm test)
          echo "Configure test commands from wiki/project-profile.md"
          exit 1

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run module-scoped build
        run: |
          set -euo pipefail
          # Example:
          # (cd packages/app && npm run build)
          echo "Configure build commands from wiki/project-profile.md"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact -v
      - name: Dependency audit
        run: |
          set -euo pipefail
          # Example:
          # (cd packages/app && npm audit --omit=dev --audit-level=critical)
          echo "Configure dependency audits from wiki/project-profile.md"
