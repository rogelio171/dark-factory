name: pr-open

on:
  pull_request:
    types: [opened, edited, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    name: Triage and arm auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply risk and auto-merge labels from PR body
        id: risk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          has_label() {
            gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq "$1"
          }

          remove_label_if_present() {
            local label="$1"
            if has_label "$label"; then
              gh pr edit "$PR_NUMBER" --remove-label "$label"
            fi
          }

          risk="$(printf '%s' "$PR_BODY" | grep -iE '^[[:space:]]*-?[[:space:]]*risk:[[:space:]]*(low|medium|high)' | head -n1 | sed -E 's/.*risk:[[:space:]]*//I' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]' || true)"
          if [ -z "$risk" ]; then
            echo "::error title=Missing risk::PR body must include '- Risk: low|medium|high'."
            exit 1
          fi

          remove_label_if_present "risk:low"
          remove_label_if_present "risk:medium"
          remove_label_if_present "risk:high"
          gh pr edit "$PR_NUMBER" --add-label "risk:$risk"

          auto_merge_eligible="false"
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*-?[[:space:]]*auto[_-]merge[[:space:]]*eligible:[[:space:]]*true'; then
            auto_merge_eligible="true"
            gh pr edit "$PR_NUMBER" --add-label "auto_merge_eligible"
          else
            remove_label_if_present "auto_merge_eligible"
          fi

          can_auto_merge="false"
          if [ "$risk" = "low" ] && [ "$auto_merge_eligible" = "true" ]; then
            can_auto_merge="true"
          fi

          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "auto_merge_eligible=$auto_merge_eligible" >> "$GITHUB_OUTPUT"
          echo "can_auto_merge=$can_auto_merge" >> "$GITHUB_OUTPUT"

      - name: Request Copilot code review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f reviewers='["copilot-pull-request-reviewer"]' || \
            echo "Copilot reviewer request failed (verify the bot is enabled in repo Settings -> Code review)."

      - name: Arm auto-merge for low-risk eligible PRs
        if: steps.risk.outputs.can_auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash
