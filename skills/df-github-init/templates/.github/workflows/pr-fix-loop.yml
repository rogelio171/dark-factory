name: pr-fix-loop

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  checks: read
  issues: write

jobs:
  decide:
    name: Decide whether to invoke df-merge
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          CHECK_CONCLUSION: ${{ github.event.check_suite.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          should_run="false"
          pr_number=""

          if [ "$EVENT_NAME" = "pull_request_review" ] && [ "$REVIEW_STATE" = "changes_requested" ]; then
            should_run="true"
            pr_number="${{ github.event.pull_request.number }}"
          elif [ "$EVENT_NAME" = "check_suite" ] && [ "$CHECK_CONCLUSION" = "failure" ]; then
            pr_number="$(gh api "repos/${REPO}/commits/${{ github.event.check_suite.head_sha }}/pulls" --jq '.[0].number // empty')"
            if [ -n "$pr_number" ]; then
              should_run="true"
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  invoke_agent:
    name: Run df-merge auto-fix loop
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.decide.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR_NUMBER"

      # ---------------------------------------------------------------------
